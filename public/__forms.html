<!doctype html>
<html lang="lt">
  <head>
    <meta charset="utf-8" />
    <title>Skanis – registracijos forma</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify Forms detection stub. Netlify scans static HTML for forms, and a
      server-rendered Next.js page can't be scanned, so the React signup form
      (src/components/sections/SignupSection.tsx) POSTs to this file instead.
      Field names must stay in sync with that component.
    -->
    <form name="beta-signup" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="beta-signup" />
      <input name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="platform" />
      <input type="text" name="consent" />
      <input type="text" name="source" />
    </form>
  </body>
</html>
